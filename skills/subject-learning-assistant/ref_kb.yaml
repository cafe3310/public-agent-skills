- type: guide
  name: 关系定义 - HAS_PLAN
  description: |-
    * **结构:** `(学习主题) -[HAS_PLAN]-> (学习计划)`
    * **用途:** 表明一个学习主题下可以包含一个或多个具体的学习计划。
  targets:
    - 学习主题
    - 学习计划
- type: guide
  name: 关系定义 - INCLUDES
  description: |-
    * **结构:** `(学习计划) -[INCLUDES]-> (概念)`
    * **用途:** 表达一个学习计划包含要教授的知识概念。
  targets:
    - 学习计划
    - 概念
- type: guide
  name: 图谱综述
  description: >-
    本知识图谱作为“学习模式助手”的长期记忆，用于服务**单用户**的学习追踪。

    * **实体类型:** 图谱中仅包含以下五种实体类型：`当前学习状态`, `学习主题`, `学习计划`, `概念`,
    `学习日志`。除此外不应创建任何其他类型的实体。 

    * **关系类型:** 图谱中仅包含以下两种关系类型：`HAS_PLAN`, `INCLUDES`。除此外不应创建任何其他类型的关系。

    * **特殊实体:** 图谱中包含一个名为 `当前学习状态` 的特殊核心实体，作为所有操作的入口点。
  targets:
    - 当前学习状态
    - 学习主题
    - 学习计划
    - 概念
    - 学习日志
    - HAS_PLAN
    - INCLUDES
- type: guide
  name: 实体类型定义 - 学习主题
  description: >-
    代表用户希望学习的一个完整的、高阶的知识领域。

    * **名称规则:** 名称应简洁明了，如 `机器学习`, `数据结构与算法`, `前端开发` 等；避免使用过于宽泛或模糊的名称，如 `编程`,
    `技术`。

    * **观察/属性:**
        * `状态`: 字符串，枚举值 (`进行中`, `已完成`)。
        * `学习动机`: 字符串。记录用户为什么想学习这个主题。
        * `学习方式`: 字符串。记录用户偏好的学习方法。
        * `背景知识`: 字符串。记录用户在该主题相关领域已有的知识水平。
        * `其他观察`: 字符串。记录用户表达的其他意愿或要求。
  targets: null
- type: guide
  name: 实体类型定义 - 学习日志
  description: >-
    作为一条独立的交互记录，用于审计和回顾。它**不与**任何其他实体建立关系。

    * **名称规则:** `学习日志-YYYYMMDD-NNN`，其中 `YYYYMMDD` 是交互发生的日期，`NNN` 是当天的交互序号，从
    `001` 开始递增。 例如，`学习日志-20250901-006` 表示 2025 年 9 月 1 日的第 6 条交互记录。

    * **观察/属性:**
        * `时间戳`: 字符串 (YYYY-MM-DD) 。
        * `关联主题`: 字符串。记录本次交互关联的 `学习主题` 名称，如果有的话。
        * `关联计划`: 字符串。记录本次交互关联的 `学习计划` 名称，如果有的话。
        * `摘要`: 字符串。对重点变更的描述。
  targets: null
- type: guide
  name: 实体类型定义 - 学习计划
  description: |-
    针对某个 `学习主题` 的一个具体的、可执行的学习路径或待办事项列表。
    * **名称规则:** 名称应包含所属的 `学习主题`，并简要描述计划内容，如 `机器学习-基础入门`, `数据结构与算法-树与图` 等。
    * **观察/属性:**
        * `创建日期`: 字符串 (YYYY-MM-DD)。
        * `任务大纲`: 字符串（任务节点）列表。按顺序记录高级别的学习任务节点。
        * `任务节点-$名称`: 字符串（概念）列表。记录 `学习路径大纲` 中，每个节点需要介绍的概念列表。`$名称` 是具体节点的名称。
        * `当前节点`: 字符串。记录用户当前正在学习的任务节点名称。
        * `当前节点待学概念队列`: 字符串（概念）列表。记录在当前节点下，尚未需要介绍的具体概念名称。介绍一个移除一个。
        * `临时学习队列`: 字符串（概念）列表。用于存放和处理用户在主线学习过程中插入的即时问题。介绍一个移除一个。
  targets: null
- type: guide
  name: 实体类型定义 - 当前学习状态
  description: |-
    这是整个知识图谱的唯一入口点。它是一个全局唯一的单例实体，作为追踪用户当前学习进度的核心指针。
    在每次对话开始时，**必须**首先读取此实体以恢复上下文。
    * **名称规则:** 固定名称 `当前学习状态`。
    * **观察/属性:**
        * `最后更新`: 字符串 (YYYY-MM-DD HH:MM:SS)
        * `当前主题`: 字符串。记录用户当前正在学习的 `学习主题` 名称。
        * `当前计划`: 字符串。记录用户当前正在进行的 `学习计划` 名称。
        * `其他状态`: 字符串。记录用户表达的其他意愿或要求。
  targets:
    - 当前学习状态
- type: guide
  name: 实体类型定义 - 概念
  description: |-
    代表一个独立的、具体的知识点。可以是某个知识概念，也可以是「如何做某件事情」这种任务名称。
    * **名称规则:** 名称应简洁但具体精确，如 `监督学习`, `快速排序算法`, `如何搭建 React 开发环境` 等。
    * **观察/属性:**
        * `简介`: 字符串。对该概念的核心定义或解释。
        * `初次介绍时间`: 字符串 (YYYY-MM-DD) 。
        * `用户反馈`: 字符串。记录用户对该概念的理解情况、疑问或反馈。可以包含多条记录。
  targets: null
