- type: entity
  name: 全局内存 vs. 共享内存
  entityType: 概念
  observations:
    - "简介: 全局内存容量大但速度慢，是 GPU 的主存储；共享内存容量小但速度快，用于 Block
      内线程的高效协作。优化关键在于用共享内存减少全局内存访问。"
    - "初次介绍时间: 2025-09-03"
    - "用户反馈: 已理解"
- type: entity
  name: 共享内存 (Shared Memory)
  entityType: 概念
  observations:
    - "用户反馈: 已理解共享内存（Shared Memory）是线程块（Thread
      Block）内所有线程共享的高速片上内存。掌握了其作为“可编程缓存”的核心思想，即通过一次协同的全局内存加载，换取后续多次高速的片上访问，以实现数\
      据重用并提升性能。"
    - "初次介绍时间: 2025-09-08"
- type: entity
  name: 内存访问合并 (Memory Coalescing)
  entityType: 概念
  observations: []
- type: entity
  name: 动态并行 (Dynamic Parallelism)
  entityType: 概念
  observations:
    - "用户反馈: 已理解动态并行允许 GPU 核函数直接启动新的子核函数，打破了以往只能由 CPU
      启动的扁平模型。掌握了其核心优势在于处理工作量不确定的自适应算法和递归问题，通过在 GPU
      内部完成“计算-分析-再计算”的闭环来避免高昂的主机-设备通信延迟。同时，也理解了其数据传递依赖指针，开发者必须手动管理数据同步和内存，特别是子核\
      函数无法直接访问父核函数的共享内存。"
    - "初次介绍时间: 2025-09-09"
- type: entity
  name: 协作组 (Cooperative Groups)
  entityType: 概念
  observations:
    - "用户反馈: 已理解协作组（Cooperative Groups）是一套打破 CUDA 僵化同步层级的现代 C++
      编程模型。掌握了其核心思想：通过将线程抽象为灵活的“组”对象，并在任意粒度上（如块内切片、整个Grid）进行同步，从而实现更模块化、可复用和面向未\
      来的 CUDA 代码。"
    - "初次介绍时间: 2025-09-09"
