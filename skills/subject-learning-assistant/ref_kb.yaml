    - "用户反馈: 已理解流（Stream）是独立的 GPU
      任务队列，事件（Event）是队列中的同步标记点。通过分析视频分块处理的流水线案例，深入掌握了如何利用多条流来重叠数据传输（Copy）和核心计算（\
      Compute），从而隐藏内存延迟，提升 GPU 硬件的整体利用率。"
    - "初次介绍时间: 2025-09-09"
- type: entity
  name: 粒子运算
  entityType: 概念
  observations:
    - "初次介绍时间: 2025-09-15"
    - "用户反馈: 已确认理解粒子运算的基本原理，以及如何使用空间划分（如统一网格）在GPU上加速粒子间的交互计算。"
- type: entity
  name: 纹理与表面内存 (Texture and Surface Memory)
  entityType: 概念
  observations:
    - "用户反馈:
      已理解纹理内存并非独立的物理内存，而是通过一个拥有专用缓存和硬件单元（如插值、边界处理）的特殊“数据访问管道”来读取全局VRAM中的数据。能够清晰\
      地区分普通全局内存访问路径和纹理内存访问路径在缓存系统、优化目标和硬件功能上的差异。"
    - "初次介绍时间: 2025-09-08"
- type: entity
  name: 线程 (Thread)、块 (Block) 和网格 (Grid)
  entityType: 概念
  observations:
    - "简介: CUDA 用于组织并行执行的三层结构。线程是基本单位，一组线程构成块，一组块构成网格。"
    - "初次介绍时间: 2025-09-03"
    - "用户反馈: 已理解"
- type: entity
  name: 统一内存 (Unified Memory)
  entityType: 概念
  observations:
    - "用户反馈: 已理解统一内存（Unified Memory）通过单一指针简化编程，并通过页面迁移机制自动在主机和设备间移动数据。了解了
      cudaMallocManaged, cudaDeviceSynchronize, cudaMemPrefetchAsync, 和
      cudaMemAdvise 的作用，并能将其与 LLM 训练中权重矩阵的优化联系起来。"
    - "初次介绍时间: 2025-09-04"
- type: entity
  name: 设备端函数与变量
  entityType: 概念
  observations:
    - "初次介绍时间: 2025-09-15"
    - "用户反馈: 已确认理解设备端函数与变量的核心概念和用途。"
- type: entity
  name: 设备端动态内存分配
  entityType: 概念
  observations:
    - "用户反馈: 已理解设备端动态内存分配的机制、优势（灵活性、节约内存）和代价（性能开销），并能清晰地辨析其与共享内存在适用场景上的根本区别。"
    - "初次介绍时间: 2025-09-08"
- type: entity
  name: 锁页内存 (Pinned Memory)
  entityType: 概念
  observations:
    - "用户反馈: 理解了锁页内存（Pinned Memory）通过固定物理地址来加速主机-设备数据传输的原理，以及它与可分页内存（Pageable
      Memory）在性能和系统资源占用上的权衡。能辨析其并非LLM VRAM需求的主要原因。"
    - "初次介绍时间: 2025-09-04"
