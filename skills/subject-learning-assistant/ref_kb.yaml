- type: entity
  name: Warp 与 SIMT 架构
  entityType: 概念
  observations:
    - "用户反馈: 已理解 SIMT (单指令多线程) 是 GPU 的核心执行模型，Warp (32个线程) 是其基本的调度和执行单元。通过对
      if/else 分支的探讨，深入理解了硬件通过串行化和线程屏蔽来处理 Warp 分化的机制，并能推断出无限循环和 goto 等非结构化控制流对
      Warp 执行的破坏性影响。"
    - "初次介绍时间: 2025-09-08"
- type: entity
  name: Warp 分化 (Warp Divergence)
  entityType: 概念
  observations:
    - "用户反馈: 已深入理解 Warp 分化是因控制流导致 Warp
      内线程执行不同路径的现象。掌握了硬件通过串行化执行和线程屏蔽来处理分化的机制，并能识别出 if-else, switch-case,
      以及条件循环是导致分化的主要来源，理解其对计算资源利用率的损害。"
    - "初次介绍时间: 2025-09-08"
- type: entity
  name: Warp 级原语 (Warp-level Primitives)
  entityType: 概念
  observations:
    - "用户反馈: 已理解 Warp 级原语是用于在 Warp 内部进行高效、无分化协作的硬件指令封装。掌握了 __shfl_sync,
      __all_sync, __ballot_sync 等核心原语的功能，并通过分析 Warp
      级规约的代码，深入理解了其如何避免共享内存和重量级同步，实现极致的线程间数据交换。"
    - "初次介绍时间: 2025-09-09"
